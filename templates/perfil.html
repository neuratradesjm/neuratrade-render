<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neura Trade - Mi Perfil</title>
</head>
<body style="background: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div style="background: #161b22; padding: 40px; border-radius: 15px; border: 1px solid #30363d; width: 400px; text-align: center;">
        <div style="width: 100px; height: 100px; background: #30363d; border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #58a6ff;">
            LG
        </div>
        <h2 style="margin: 0;">{{ user_info.nombre }}</h2>
        <p style="color: #8b949e;">{{ user_info.email }}</p>
        <hr style="border: 0.5px solid #30363d; margin: 20px 0;">
        <div style="text-align: left;">
            <p><strong>Teléfono:</strong> {{ user_info.telefono }}</p>
            <p><strong>Ubicación:</strong> San Juan de los Morros, Guárico</p>
            <p><strong>Estatus de Cuenta:</strong> <span style="color: #3fb950;">Verificada</span></p>
        </div>
        <a href="/billetera" style="display: block; margin-top: 30px; padding: 12px; background: #30363d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Volver a la Billetera</a>
    </div>
</body>
</html>
