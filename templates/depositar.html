<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neura Trade - Depositar Fondos</title>
</head>
<body style="background: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">
    <div style="background: #161b22; padding: 40px; border-radius: 15px; border: 1px solid #30363d; width: 450px; text-align: center;">
        <h2 style="color: #58a6ff;">Pasarela de Depósito USDT</h2>
        <p style="color: #8b949e;">Envía tus fondos a la siguiente dirección (Red TRC20):</p>
        
        <div style="background: #0d1117; padding: 15px; border-radius: 8px; border: 1px dashed #58a6ff; margin: 20px 0; word-break: break-all;">
            <code id="wallet">{{ direccion }}</code>
        </div>

        <form action="/confirmar_pago" method="POST" style="text-align: left; margin-top: 25px;">
            <label style="display: block; margin-bottom: 8px;">Monto Enviado (Min $20):</label>
            <input type="number" name="monto" min="20" step="0.01" required style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; margin-bottom: 20px;">
            
            <label style="display: block; margin-bottom: 8px;">ID de Transacción (TXID):</label>
            <input type="text" name="txid" required placeholder="Pega aquí el hash de la transacción" style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; margin-bottom: 25px;">
            
            <button type="submit" style="width: 100%; padding: 15px; background: #238636; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer;">NOTIFICAR PAGO</button>
        </form>
        
        <a href="/billetera" style="display: block; margin-top: 20px; color: #8b949e; text-decoration: none; font-size: 14px;">Cancelar y Volver</a>
    </div>
</body>
</html>
