<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Neura Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .card-stat { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark p-3 border-bottom border-secondary">
        <span class="navbar-brand fw-bold">NEURA TRADE</span>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
    </nav>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card-stat">
                    <p class="text-secondary small mb-1">Balance Actual</p>
                    <h3 class="text-success">${{ "{:,.2f}".format(balance) }}</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-stat">
                    <p class="text-secondary small mb-1">Profit Tridox</p>
                    <h3 class="text-primary">+${{ profit_diario }}</h3>
                </div>
            </div>
            <div class="col-md-4">
                <form action="/ejecutar_trade" method="POST">
                    <button type="submit" class="btn btn-primary w-100 h-100 py-3 fw-bold">ACTIVAR BOT</button>
                </form>
            </div>
        </div>
        <div id="chart" style="height: 500px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden;"></div>
    </div>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        new TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "15",
            "timezone": "America/Caracas", "theme": "dark", "style": "1",
            "locale": "es", "container_id": "chart"
        });
    </script>
</body>
</html>
