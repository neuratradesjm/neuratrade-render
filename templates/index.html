<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neura Trade | Sistema de Trading Algorítmico</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --success: #238636;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--accent); font-size: 24px; margin: 0; }
        .header p { color: #8b949e; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); outline: none; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #2ea043; }
        
        .footer-info {
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h1>NEURA TRADE</h1>
            <p>Acceso al Terminal de Trading Real</p>
        </div>

        <!-- El action="/login" conecta directamente con el app.py -->
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="usuario">Usuario o Correo Electrónico</label>
                <input type="text" id="usuario" name="usuario" required placeholder="admin o cliente">
            </div>

            <div class="form-group">
                <label for="clave">Contraseña de Seguridad</label>
                <input type="password" id="clave" name="clave" required placeholder="••••••••">
            </div>

            <button type="submit">ACCEDER AL SISTEMA</button>
        </form>

        <div class="footer-info">
            <p>Conectado a Binance API v3 | Sistema Real de Gestión</p>
            <p>&copy; 2026 Neura Trade - Todos los derechos reservados.</p>
        </div>
    </div>

</body>
</html>
