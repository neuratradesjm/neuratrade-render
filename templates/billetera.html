<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neura Trade - Billetera y Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: #0d1117; color: white; font-family: sans-serif; padding: 20px;">
    <nav style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px;">
        <h2>NEURA TRADE | Panel de Control</h2>
        <div>
            <span style="margin-right: 20px; color: #8b949e;">Usuario: <strong>{{ user }}</strong></span>
            <a href="/perfil" style="color: #58a6ff; text-decoration: none; margin-right: 15px;">Perfil</a>
            <a href="/salir" style="color: #f85149; text-decoration: none;">Cerrar Sesión</a>
        </div>
    </nav>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 30px;">
        <!-- Configuración del Bot Real -->
        <div style="background: #161b22; padding: 25px; border-radius: 10px; border: 1px solid #30363d;">
            <h3>Configuración del Bot en Línea</h3>
            <form action="/billetera" method="GET">
                <label style="display: block; margin-bottom: 10px;">Seleccionar Mercado para Operar:</label>
                <select name="mercado" onchange="this.form.submit()" style="width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px;">
                    {% for m in mercados %}
                    <option value="{{ m }}" {% if datos.mercado == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </form>
            <div style="margin-top: 20px; padding: 15px; background: rgba(56, 185, 80, 0.1); border: 1px solid #3fb950; border-radius: 5px;">
                <p style="margin: 0;">Estado: <strong style="color: #3fb950;">{{ datos.estado }}</strong></p>
                <p style="margin: 10px 0 0 0;">Precio {{ datos.mercado }}: <strong>${{ datos.precio_actual }}</strong></p>
            </div>
        </div>

        <!-- Gestión de Fondos -->
        <div style="background: #161b22; padding: 25px; border-radius: 10px; border: 1px solid #30363d; text-align: center;">
            <h3>Balance Disponible (USDT)</h3>
            <h1 style="font-size: 48px; color: #58a6ff; margin: 20px 0;">${{ datos.balance }}</h1>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button style="padding: 12px 20px; background: #238636; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;">Ingresar Fondos ($20)</button>
                <button style="padding: 12px 20px; background: #8957e5; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold;">Retirar Ganancias</button>
            </div>
        </div>
    </div>
</body>
</html>
