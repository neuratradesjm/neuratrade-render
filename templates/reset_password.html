<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Neura Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* Fondo oscuro acorde a Neura Trade */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .btn-primary {
            background-color: #3b82f6;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: white;
            border-color: #3b82f6;
            box-shadow: none;
        }
        .logo-text {
            font-weight: bold;
            letter-spacing: 1px;
            color: #3b82f6;
        }
    </style>
</head>
<body>

    <div class="card p-4 shadow">
        <div class="text-center mb-4">
            <h2 class="logo-text">NEURA TRADE</h2>
            <p class="text-secondary">Recuperación de cuenta</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/reset_password" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" name="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                <div class="form-text text-secondary">Te enviaremos un enlace para restablecer tu contraseña.</div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Enviar Enlace</button>
            
            <div class="text-center">
                <a href="/login" class="text-decoration-none text-secondary small">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
